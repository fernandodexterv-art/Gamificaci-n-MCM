// ===== CASO 2.4: ENGRANAJES CON PISTAS PASO A PASO =====
function setupEngranajesPaso(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  state.paso = 0;
  state.respuesta = '';

  function renderEngranajes(){
    let html = '';

    // Mostrar engranajes visualmente
    html += '<div style="background:#090d16;border-radius:12px;padding:20px;margin-bottom:15px;text-align:center;">';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:1rem;margin-bottom:15px;">⚙️ Engranajes del hiperreactor</div>';
    html += '<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;">';
    lvl.numeros.forEach(function(n, i){
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      html += '<div style="text-align:center;">';
      html += '<div style="width:70px;height:70px;border-radius:50%;border:4px dashed ' + color + ';display:flex;justify-content:center;align-items:center;font-family:Orbitron;font-size:1.4rem;color:' + color + ';font-weight:bold;margin:0 auto;">' + n + '</div>';
      html += '<div style="font-family:Orbitron;font-size:0.8rem;color:#94a3b8;margin-top:5px;">cada ' + n + 's</div>';
      html += '</div>';
    });
    html += '</div></div>';

    // Pistas paso a paso
    if(state.paso === 0){
      html += '<div style="background:rgba(0,242,255,0.08);border-left:4px solid #00f2ff;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:0.95rem;margin-bottom:10px;">📌 Pista 1: Descompón cada número en factores primos.</div>';
      html += '<div style="color:#cbd5e1;font-size:1rem;">';
      lvl.numeros.forEach(function(n){
        const desc = descomponer(n);
        html += n + ' = ' + desc + '<br>';
      });
      html += '</div>';
      html += '</div>';
      html += '<button class="btn btn-action" onclick="avanzarEngranajes()">Ya descompuse → Siguiente paso</button>';
    } else if(state.paso === 1){
      // Mostrar productos por primo
      let desA = descomponer(lvl.numeros[0]);
      let desB = descomponer(lvl.numeros[1]);
      let desC = descomponer(lvl.numeros[2]);
      
      // Extraer exponentes
      const expsA = extraerExponentes(lvl.numeros[0]);
      const expsB = extraerExponentes(lvl.numeros[1]);
      const expsC = extraerExponentes(lvl.numeros[2]);
      
      html += '<div style="background:rgba(168,85,247,0.1);border-left:4px solid #a855f7;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#a855f7;font-size:0.95rem;margin-bottom:10px;">📌 Pista 2: Toma el MAYOR exponente de cada primo.</div>';
      html += '<div style="color:#cbd5e1;font-size:1rem;">';
      const todosPrimos = Array.from(new Set([...Object.keys(expsA), ...Object.keys(expsB), ...Object.keys(expsC)])).sort((a,b)=>a-b);
      todosPrimos.forEach(function(p){
        const eA = expsA[p] || 0;
        const eB = expsB[p] || 0;
        const eC = expsC[p] || 0;
        const max = Math.max(eA, eB, eC);
        html += 'Primo ' + p + ': exponentes → ' + eA + ', ' + eB + ', ' + eC + ' → mayor es <b>' + max + '</b><br>';
      });
      html += '</div></div>';
      html += '<button class="btn btn-action" onclick="avanzarEngranajes()">Ya tomé el mayor → Siguiente paso</button>';
    } else if(state.paso === 2){
      // Pedir la respuesta final
      html += '<div style="background:rgba(57,255,20,0.1);border-left:4px solid #39ff14;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#39ff14;font-size:0.95rem;margin-bottom:10px;">📌 Paso final: Multiplica los mayores exponentes.</div>';
      html += '<div style="color:#cbd5e1;font-size:1rem;">Multiplica el mayor exponente de cada primo para obtener el m.c.m.</div>';
      html += '</div>';
      html += '<div class="input-box-central">';
      html += '<input type="number" id="engr-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:130px;text-align:center;padding:10px;border-radius:8px;">';
      html += '<button class="btn" onclick="verificarEngranajes()">Verificar m.c.m.</button>';
      html += '</div>';
    }

    sandbox.innerHTML = html;
    if(state.paso === 2){
      setTimeout(function(){
        const inp = document.getElementById('engr-input');
        if(inp) inp.focus();
      }, 50);
    }
  }

  function descomponer(n){
    const factores = {};
    let x = n;
    for(let p=2; p<=x; p++){
      while(x % p === 0){
        factores[p] = (factores[p]||0)+1;
        x /= p;
      }
    }
        let partes = [];
    for(const p in factores){
      partes.push(factores[p] > 1 ? p + '^' + factores[p] : '' + p);
    }
    return partes.join(' × ');
  }

  function extraerExponentes(n){
    const factores = {};
    let x = n;
    for(let p=2; p<=x; p++){
      while(x % p === 0){
        factores[p] = (factores[p]||0)+1;
        x /= p;
      }
    }
    return factores;
  }

  window.avanzarEngranajes = function(){
    state.paso++;
    playSound('hit');
    renderEngranajes();
  };

  window.verificarEngranajes = function(){
    const inp = document.getElementById('engr-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! m.c.m.(4,6,8) = 24. Tomamos el mayor exponente de cada primo: 2³ × 3 = 8 × 3 = 24.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4000);
    } else {
      playSound('error');
      showFeedback(false, 'Intenta de nuevo. Multiplica los mayores exponentes de cada primo.');
    }
  };

  renderEngranajes();
}

// ===== CASO 2.5: HIPER-CONECTOR CON PISTAS =====
function setupHiperConectorPaso(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  state.paso = 0;

  function descomponer(n){
    const f = {};
    let x = n;
    for(let p=2; p<=x; p++){
      while(x % p === 0){ f[p] = (f[p]||0)+1; x /= p; }
    }
    let partes = [];
    for(const p in f){ partes.push(f[p] > 1 ? p + '^' + f[p] : p); }
    return partes.join(' × ');
  }

  function extraerExponentes(n){
    const f = {};
    let x = n;
    for(let p=2; p<=x; p++){
      while(x % p === 0){ f[p] = (f[p]||0)+1; x /= p; }
    }
    return f;
  }

  function renderHiper(){
    let html = '';

    html += '<div style="background:#090d16;border-radius:12px;padding:15px;margin-bottom:15px;text-align:center;">';
    html += '<div style="font-family:Orbitron;color:#a855f7;font-size:1rem;margin-bottom:12px;">📡 Antenas de la Red Estelar</div>';
    html += '<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;">';
    lvl.numeros.forEach(function(n, i){
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      html += '<div style="text-align:center;padding:12px;background:rgba(0,0,0,0.3);border-radius:10px;border:1px solid ' + color + ';">';
      html += '<div style="font-family:Orbitron;color:' + color + ';font-size:1.4rem;font-weight:bold;">' + n + 's</div>';
      html += '<div style="font-size:0.75rem;color:#94a3b8;">Antena ' + (i+1) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';

    if(state.paso === 0){
      html += '<div style="background:rgba(0,242,255,0.08);border-left:4px solid #00f2ff;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:0.95rem;margin-bottom:10px;">📌 Pista 1: Descomposición factorial</div>';
      lvl.numeros.forEach(function(n){
        html += '<div style="color:#cbd5e1;font-size:1.05rem;margin:3px 0;">' + n + ' = ' + descomponer(n) + '</div>';
      });
      html += '</div>';
      html += '<button class="btn btn-action" onclick="avanzarHiper()">Siguiente paso</button>';
    } else if(state.paso === 1){
      const exps = lvl.numeros.map(function(n){ return extraerExponentes(n); });
      const todosPrimos = Array.from(new Set([].concat.apply([], exps.map(Object.keys)))).sort(function(a,b){return a-b;});
      
      html += '<div style="background:rgba(168,85,247,0.1);border-left:4px solid #a855f7;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#a855f7;font-size:0.95rem;margin-bottom:10px;">📌 Pista 2: Mayor exponente por primo</div>';
      todosPrimos.forEach(function(p){
        const valores = exps.map(function(e){ return e[p] || 0; });
        const max = Math.max.apply(null, valores);
        html += '<div style="color:#cbd5e1;font-size:1.05rem;margin:3px 0;">Primo ' + p + ': exponentes [' + valores.join(', ') + '] → mayor = <b style="color:#fde047;">' + max + '</b></div>';
      });
      html += '</div>';
      html += '<button class="btn btn-action" onclick="avanzarHiper()">Siguiente paso</button>';
    } else {
      const exps = lvl.numeros.map(function(n){ return extraerExponentes(n); });
      const todosPrimos = Array.from(new Set([].concat.apply([], exps.map(Object.keys)))).sort(function(a,b){return a-b;});
      const partes = todosPrimos.map(function(p){
        const max = Math.max.apply(null, exps.map(function(e){ return e[p] || 0; }));
        return p + (max > 1 ? '^' + max : '');
      });
      
      html += '<div style="background:rgba(57,255,20,0.1);border-left:4px solid #39ff14;padding:15px;border-radius:6px;margin-bottom:15px;">';
      html += '<div style="font-family:Orbitron;color:#39ff14;font-size:0.95rem;margin-bottom:10px;">📌 Paso final: Multiplica los mayores exponentes</div>';
      html += '<div style="color:#cbd5e1;font-size:1.05rem;">m.c.m. = ' + partes.join(' × ') + '</div>';
      html += '</div>';
      html += '<div class="input-box-central">';
      html += '<input type="number" id="hiper-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:140px;text-align:center;padding:10px;border-radius:8px;">';
      html += '<button class="btn" onclick="verificarHiper()">Verificar m.c.m.</button>';
      html += '</div>';
    }

    sandbox.innerHTML = html;
    if(state.paso === 2){
      setTimeout(function(){
        const inp = document.getElementById('hiper-input');
        if(inp) inp.focus();
      }, 50);
    }
  }

  window.avanzarHiper = function(){
    state.paso++;
    playSound('hit');
    renderHiper();
  };

  window.verificarHiper = function(){
    const inp = document.getElementById('hiper-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! m.c.m.(12,15,20) = 60. Los mayores exponentes son 2² × 3 × 5 = 60.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4000);
    } else {
      playSound('error');
      showFeedback(false, 'Intenta de nuevo. Revisa el producto de los mayores exponentes.');
    }
  };

  renderHiper();
}

function setupIntroCapsulas(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  sandbox.innerHTML = 
    '<div style="background:rgba(0,242,255,0.08);border-left:4px solid #00f2ff;border-radius:10px;padding:15px;margin-bottom:15px;">' +
    '<div style="font-family:Orbitron;color:#00f2ff;font-size:1rem;margin-bottom:10px;">🌍 ¿Dónde usamos el MCM en la vida real?</div>' +
    '<div style="color:#cbd5e1;font-size:0.95rem;line-height:1.5;">' +
    'Cuando dos o más eventos ocurren con ritmos distintos pero necesitamos saber <b>cuándo vuelven a coincidir</b>, usamos el MCM. Por ejemplo: ' +
    '<br>• Dos autobuses que salen de la misma terminal cada 6 y 8 minutos.' +
    '<br>• Dos alarmas que suenan cada cierto tiempo.' +
    '<br>• Dos luces que parpadean con distinta frecuencia.' +
    '</div>' +
    '</div>' +
    '<div style="background:#090d16;border-radius:12px;padding:20px;margin-bottom:15px;">' +
    '<div style="font-family:Orbitron;color:#fde047;font-size:1rem;margin-bottom:15px;text-align:center;">🚀 Ejemplo visual: Cápsulas Espaciales</div>' +
    '<canvas id="circuitoCanvas" width="800" height="220" style="background:#05070c;border-radius:10px;border:1px solid #4b5563;"></canvas>' +
    '<div style="display:flex;justify-content:center;gap:25px;margin-top:12px;font-family:Orbitron;font-size:0.9rem;">' +
    '<span style="color:#00f2ff;">🛸 A = cada ' + lvl.a + ' segundos</span>' +
    '<span style="color:#ff0077;">🚀 B = cada ' + lvl.b + ' segundos</span>' +
    '</div>' +
    '</div>' +
    '<div style="background:rgba(253,224,71,0.1);border-left:4px solid #fde047;padding:12px 15px;border-radius:6px;margin-bottom:15px;">' +
    '<div style="color:#fde047;font-size:1rem;">🎯 <b>Observa con atención:</b> ¿En qué segundo aterrizan AMBAS cápsulas en el MISMO número por primera vez? Anótalo.</div>' +
    '</div>' +
    '<div style="display:flex;justify-content:center;gap:15px;margin-bottom:15px;">' +
    '<button class="btn" onclick="reiniciarIntro()" style="background:linear-gradient(135deg,#475569,#334155);">🔄 Reiniciar animación</button>' +
    '</div>' +
    '<div class="input-box-central">' +
    '<input type="number" id="calc-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:130px;text-align:center;padding:10px;border-radius:8px;">' +
    '<button class="btn" onclick="verificarIntroCapsulas()">Verificar</button>' +
    '</div>';

  canvas = document.getElementById('circuitoCanvas');
  ctx = canvas.getContext('2d');

  state.pasoA = 0;
  state.pasoB = 0;
  state.juegoTerminado = false;
  state.frameContador = 0;
  state.framesPorSalto = 45;
  state.maxPasos = 7;
  state.destelloMostrado = false;
  state.momentoCoincidencia = 0;

  window.reiniciarIntro = function(){
    state.pasoA = 0;
    state.pasoB = 0;
    state.frameContador = 0;
    state.destelloMostrado = false;
    state.momentoCoincidencia = 0;
    playSound('hit');
  };

  function renderSalto(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const xIni = 60;
    const xFin = canvas.width - 60;
    const ancho = xFin - xIni;
    const yA = 80;
    const yB = 160;

    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 14px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Posición A: ' + (state.pasoA * lvl.a) + '   ·   Posición B: ' + (state.pasoB * lvl.b), canvas.width/2, 25);

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(xIni, yA); ctx.lineTo(xFin, yA); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xIni, yB); ctx.lineTo(xFin, yB); ctx.stroke();

    const maxTiempo = 56;
    const escala = ancho / maxTiempo;

    for(let k = 1; k * lvl.a <= maxTiempo; k++){
      const t = k * lvl.a;
      const x = xIni + t * escala;
      const activo = k <= state.pasoA;
      const esComun = (t % lvl.a === 0 && t % lvl.b === 0);
      ctx.fillStyle = activo ? (esComun ? '#39ff14' : '#00f2ff') : '#334155';
      ctx.beginPath(); ctx.arc(x, yA, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = activo ? '#fff' : '#64748b';
      ctx.font = '10px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(t, x, yA - 15);
    }

    for(let k = 1; k * lvl.b <= maxTiempo; k++){
      const t = k * lvl.b;
      const x = xIni + t * escala;
      const activo = k <= state.pasoB;
      const esComun = (t % lvl.a === 0 && t % lvl.b === 0);
      ctx.fillStyle = activo ? (esComun ? '#39ff14' : '#ff0077') : '#334155';
      ctx.beginPath(); ctx.arc(x, yB, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = activo ? '#fff' : '#64748b';
      ctx.font = '10px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(t, x, yB + 20);
    }

    const posA = state.pasoA > 0 ? xIni + (state.pasoA * lvl.a) * escala : xIni;
    const posB = state.pasoB > 0 ? xIni + (state.pasoB * lvl.b) * escala : xIni;

    ctx.fillStyle = '#00f2ff';
    ctx.beginPath(); ctx.arc(posA, yA, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#030712';
    ctx.font = 'bold 11px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('A', posA, yA);

    ctx.fillStyle = '#ff0077';
    ctx.beginPath(); ctx.arc(posB, yB, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#030712';
    ctx.fillText('B', posB, yB);

    const numA = state.pasoA * lvl.a;
    const numB = state.pasoB * lvl.b;
    
    if(numA === numB && numA > 0 && !state.destelloMostrado){
      state.destelloMostrado = true;
      state.momentoCoincidencia = Date.now();
      playSound('success');
    }

    if(state.destelloMostrado && Date.now() - state.momentoCoincidencia < 2000){
      const intensidad = Math.abs(Math.sin((Date.now() - state.momentoCoincidencia) / 150));
      ctx.strokeStyle = 'rgba(57,255,20,' + (0.4 + intensidad * 0.6) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(posA, yA, 22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(posB, yB, 22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(posA, yA);
      ctx.lineTo(posB, yB);
      ctx.stroke();
      ctx.fillStyle = '#39ff14';
      ctx.font = 'bold 18px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText('¡COINCIDIERON!', canvas.width/2, canvas.height - 10);
    }

    if(!state.juegoTerminado && !state.destelloMostrado){
      state.frameContador++;
      if(state.frameContador >= state.framesPorSalto){
        state.frameContador = 0;
        const proxA = state.pasoA * lvl.a;
        const proxB = state.pasoB * lvl.b;
        if(proxA <= proxB && state.pasoA < state.maxPasos){
          state.pasoA++;
        } else if(state.pasoB < state.maxPasos){
          state.pasoB++;
        }
      }
    }

    if(!state.juegoTerminado){
      animationId = requestAnimationFrame(renderSalto);
    }
  }
  renderSalto();

  window.verificarIntroCapsulas = function(){
    const inp = document.getElementById('calc-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      state.juegoTerminado = true;
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! Coinciden por primera vez en el segundo ' + lvl.correctAnswer + '. A dio 4 saltos (6, 12, 18, 24) y B dio 3 saltos (8, 16, 24). Ese número —el MENOR múltiplo común— es justamente lo que llamamos MCM. Así funciona en la vida real: cuando dos eventos vuelven a coincidir.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 5500);
    } else {
      playSound('error');
      showFeedback(false, 'Observa de nuevo. Fíjate en la primera vez que A y B aterrizan en el MISMO número. Puedes reiniciar la animación.');
    }
  };
}
// ===== CASO 2.4: ENGRANAJES DINÁMICOS =====

    }).join('') +
    '</div>' +
    '</div>' +
    '<div style="background:rgba(253,224,71,0.1);border-left:4px solid #fde047;padding:12px 15px;border-radius:6px;margin-bottom:15px;">' +
    '<div style="color:#fde047;font-size:1rem;">🎯 <b>Observa cómo giran.</b> ¿Después de cuántos segundos vuelven los tres engranajes a estar alineados al mismo tiempo por primera vez?</div>' +
    '</div>' +
    '<div style="display:flex;justify-content:center;gap:15px;margin-bottom:15px;">' +
    '<button class="btn" onclick="reiniciarEngr()" style="background:linear-gradient(135deg,#475569,#334155);">🔄 Reiniciar</button>' +
    '<button class="btn" onclick="mostrarPistaEngr()" style="background:linear-gradient(135deg,#a855f7,#7c3aed);">💡 Ver tabla de tiempos</button>' +
    '</div>' +
    '<div id="pista-engr" style="margin-bottom:15px;"></div>' +
    '<div class="input-box-central">' +
    '<input type="number" id="calc-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:140px;text-align:center;padding:10px;border-radius:8px;">' +
    '<button class="btn" onclick="verificarEngr()">Verificar</button>' +
    '</div>';

  canvas = document.getElementById('engrCanvas');
  ctx = canvas.getContext('2d');

  state.t = 0;
  state.juegoTerminado = false;
  state.ultimoFrame = performance.now();
  state.velocidad = 0.8;
  state.pistaMostrada = false;
  state.destelloMostrado = false;
  state.momentoAlineado = 0;

  window.reiniciarEngr = function(){
    state.t = 0;
    state.destelloMostrado = false;
    state.momentoAlineado = 0;
    state.ultimoFrame = performance.now();
    playSound('hit');
  };

  window.mostrarPistaEngr = function(){
    if(state.pistaMostrada) return;
    state.pistaMostrada = true;
    let html = '<div style="background:rgba(168,85,247,0.1);border-left:4px solid #a855f7;padding:12px 15px;border-radius:6px;">';
    html += '<div style="font-family:Orbitron;color:#a855f7;font-size:0.9rem;margin-bottom:8px;">📊 Tabla de tiempos de vuelta:</div>';
    html += '<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:0.85rem;">';
    lvl.numeros.forEach(function(n, i){
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      const tiempos = [];
      for(let k=1; k<=8; k++) tiempos.push(k*n);
      html += '<div style="color:' + color + ';font-family:Orbitron;">Engranaje ' + (i+1) + ': ' + tiempos.join(', ') + '...';
      html += '</div>';
    });
    html += '</div>';
    html += '<div style="margin-top:8px;color:#94a3b8;font-size:0.8rem;">Busca el menor número que aparezca en las TRES listas.</div>';
    html += '</div>';
    document.getElementById('pista-engr').innerHTML = html;
  };

  function renderEngr(){
    const ahora = performance.now();
    const dt = (ahora - state.ultimoFrame) / 1000;
    state.ultimoFrame = ahora;

    if(!state.juegoTerminado && !state.destelloMostrado){
      state.t += dt * state.velocidad;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const centroY = 130;
    const separacion = 220;
    const radio = 55;

    // Dibujar 3 engranajes girando
    lvl.numeros.forEach(function(n, i){
      const cx = canvas.width/2 + (i-1) * separacion;
      const cy = centroY;
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      
      // Velocidad de rotación: 1 vuelta cada n segundos
      const angulo = (state.t / n) * Math.PI * 2;

      // Círculo exterior
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, radio, 0, Math.PI*2); ctx.stroke();
      
      // Dientes (12 dientes)
      const dientes = 12;
      for(let d=0; d<dientes; d++){
        const a = angulo + (d / dientes) * Math.PI * 2;
        const x1 = cx + Math.cos(a) * radio;
        const y1 = cy + Math.sin(a) * radio;
        const x2 = cx + Math.cos(a) * (radio + 8);
        const y2 = cy + Math.sin(a) * (radio + 8);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      
      // Marca de referencia (línea desde el centro hacia arriba)
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angulo - Math.PI/2) * radio, cy + Math.sin(angulo - Math.PI/2) * radio);
      ctx.lineWidth = 4;
      ctx.stroke();
      
      // Centro
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
      
      // Número dentro
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Orbitron';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n + 's', cx, cy + radio + 30);
      
      // Nombre arriba
      ctx.fillStyle = color;
      ctx.font = 'bold 12px Orbitron';
      ctx.fillText('Engranaje ' + (i+1), cx, cy - radio - 25);
    });

    // Contador de tiempo
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 18px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('t = ' + state.t.toFixed(1) + 's', canvas.width/2, 30);

    // Detectar si los tres están alineados
    // Están alineados cuando cada engranaje ha completado un número entero de vueltas
    const alineados = lvl.numeros.every(function(n){
      const vueltas = state.t / n;
      return Math.abs(vueltas - Math.round(vueltas)) < 0.08;
    });

    if(alineados && state.t > 1 && !state.destelloMostrado){
      state.destelloMostrado = true;
      state.momentoAlineado = Date.now();
      playSound('success');
    }

    if(state.destelloMostrado && Date.now() - state.momentoAlineado < 2000){
      const intensidad = Math.abs(Math.sin((Date.now() - state.momentoAlineado) / 150));
      ctx.strokeStyle = 'rgba(57,255,20,' + (0.4 + intensidad * 0.6) + ')';
      ctx.lineWidth = 4;
      const centroY2 = 130;
      for(let i=0; i<3; i++){
        const cx = canvas.width/2 + (i-1) * 220;
        ctx.beginPath(); ctx.arc(cx, centroY2, 70, 0, Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = '#39ff14';
      ctx.font = 'bold 20px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText('¡ALINEADOS!', canvas.width/2, canvas.height - 15);
    }

    if(!state.juegoTerminado){
      animationId = requestAnimationFrame(renderEngr);
    }
  }
  renderEngr();

  window.verificarEngr = function(){
    const inp = document.getElementById('calc-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      state.juegoTerminado = true;
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! Se alinean por primera vez a los ' + lvl.correctAnswer + ' segundos. Ese número es el menor que es múltiplo de 4, 6 y 8 al mismo tiempo: 4×6=24, 6×4=24, 8×3=24.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4500);
    } else {
      playSound('error');
      showFeedback(false, 'Observa de nuevo, o usa la tabla de tiempos para buscar el menor número que aparece en las tres listas.');
    }
  };
}

// ===== CASO 2.5: HIPER-CONECTOR DINÁMICO =====
function setupHiperConectorDinamico(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  sandbox.innerHTML = 
    '<div style="background:#090d16;border-radius:12px;padding:20px;margin-bottom:15px;">' +
    '<div style="font-family:Orbitron;color:#a855f7;font-size:1rem;margin-bottom:15px;text-align:center;">📡 Red Estelar de Antenas</div>' +
    '<canvas id="hiperCanvas" width="800" height="240" style="background:#05070c;border-radius:10px;border:1px solid #4b5563;"></canvas>' +
    '<div style="display:flex;justify-content:space-around;margin-top:12px;font-family:Orbitron;font-size:0.9rem;flex-wrap:wrap;gap:8px;">' +
    lvl.numeros.map(function(n, i){
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      return '<span style="color:' + color + ';">📡 Antena ' + String.fromCharCode(65+i) + ': emite cada ' + n + 's</span>';
    }).join('') +
    '</div>' +
    '</div>' +
    '<div style="background:rgba(253,224,71,0.1);border-left:4px solid #fde047;padding:12px 15px;border-radius:6px;margin-bottom:15px;">' +
    '<div style="color:#fde047;font-size:1rem;">🎯 <b>Observa cómo pulsan las antenas.</b> Cada una emite a su propio ritmo. Analiza los tiempos y calcula: ¿después de cuántos segundos las tres antenas emitirán un pulso AL MISMO TIEMPO por primera vez?</div>' +
    '</div>' +
    '<div style="display:flex;justify-content:center;gap:15px;margin-bottom:15px;">' +
    '<button class="btn" onclick="reiniciarHiper()" style="background:linear-gradient(135deg,#475569,#334155);">🔄 Reiniciar animación</button>' +
    '</div>' +
    '<div class="input-box-central">' +
    '<input type="number" id="calc-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:140px;text-align:center;padding:10px;border-radius:8px;">' +
    '<button class="btn" onclick="verificarHiper()">Verificar</button>' +
    '</div>';

  canvas = document.getElementById('hiperCanvas');
  ctx = canvas.getContext('2d');

  state.t = 0;
  state.juegoTerminado = false;
  state.ultimoFrame = performance.now();
  state.velocidad = 0.6;

  window.reiniciarHiper = function(){
    state.t = 0;
    state.ultimoFrame = performance.now();
    playSound('hit');
  };

  function renderHiper(){
    const ahora = performance.now();
    const dt = (ahora - state.ultimoFrame) / 1000;
    state.ultimoFrame = ahora;

    if(!state.juegoTerminado){
      state.t += dt * state.velocidad;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const xIni = 70;
    const xFin = canvas.width - 40;
    const ancho = xFin - xIni;
    const yBase = [70, 130, 190];
    const totalTiempo = 70; // mostrar hasta 70 segundos

    // Título de tiempo
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 16px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('t = ' + state.t.toFixed(1) + 's', canvas.width/2, 20);

    // Marcas de tiempo en la base
    for(let s=0; s<=totalTiempo; s+=10){
      const x = xIni + s * (ancho / totalTiempo);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, canvas.height - 10); ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '9px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(s + 's', x, canvas.height - 5);
    }

    // Dibujar 3 líneas de tiempo con pulsos
    lvl.numeros.forEach(function(n, i){
      const y = yBase[i];
      const color = i === 0 ? '#00f2ff' : (i === 1 ? '#ff0077' : '#39ff14');
      const nombre = String.fromCharCode(65+i);

      // Línea base
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(xIni, y); ctx.lineTo(xFin, y); ctx.stroke();

      // Etiqueta
      ctx.fillStyle = color;
      ctx.font = 'bold 12px Orbitron';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('Antena ' + nombre, 5, y);

      // Pulsos
      for(let s = 0; s <= totalTiempo; s += n){
        if(s === 0) continue;
        const x = xIni + s * (ancho / totalTiempo);
        const yaOcurrio = (s <= state.t);
        
        if(yaOcurrio){
          // Pulso que ya ocurrió: círculo lleno del color
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill();
          // Resaltar brevemente si acaba de ocurrir (dentro de 0.5s)
          if(state.t - s < 0.5){
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.stroke();
          }
        } else {
          // Pulso futuro: solo una marca sutil
          ctx.fillStyle = '#334155';
          ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
        }
      }

      // Indicador de la posición actual de la antena (onda viajando)
      const posActual = xIni + state.t * (ancho / totalTiempo);
      if(posActual <= xFin && posActual >= xIni){
        ctx.fillStyle = color + '66';
        ctx.beginPath(); ctx.arc(posActual, y, 10, 0, Math.PI*2); ctx.fill();
      }
    });

    // Línea vertical del "ahora"
    const xAhora = xIni + state.t * (ancho / totalTiempo);
    if(xAhora <= xFin){
      ctx.strokeStyle = 'rgba(253,224,71,0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(xAhora, 40); ctx.lineTo(xAhora, canvas.height - 15); ctx.stroke();
      ctx.setLineDash([]);
    }

    if(!state.juegoTerminado){
      animationId = requestAnimationFrame(renderHiper);
    }
  }
  renderHiper();

  window.verificarHiper = function(){
    const inp = document.getElementById('calc-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      state.juegoTerminado = true;
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! Las tres antenas coinciden a los ' + lvl.correctAnswer + ' segundos. Es el menor número que es múltiplo de 12, 15 y 20 al mismo tiempo: 12×5=60, 15×4=60, 20×3=60.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4500);
    } else {
      playSound('error');
      showFeedback(false, 'Analiza los pulsos de cada antena. ¿Cuál es el primer segundo donde TODAS tienen un pulso? Piensa en los múltiplos de cada número.');
    }
  };
}
window.onload = function(){ initLevel(); };
</script>
