<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sincro-MCM Cósmico</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--space-bg:#030712;--panel-bg:rgba(17,24,39,0.95);--neon-cyan:#00f2ff;
  --neon-magenta:#ff0077;--neon-green:#39ff14;--neon-yellow:#fde047;--slate-300:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{font-family:'Rajdhani',sans-serif;background:var(--space-bg);color:#f8fafc;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;}
.game-viewport{width:100%;max-width:950px;background:var(--panel-bg);border:2px solid #1f2937;
  border-radius:24px;padding:25px;box-shadow:0 0 40px rgba(0,242,255,0.15);}
header{display:flex;justify-content:space-between;align-items:center;
  border-bottom:2px solid #1f2937;padding-bottom:15px;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
h1{font-family:'Orbitron',sans-serif;font-size:1.4rem;color:var(--neon-cyan);}
.level-info{display:flex;gap:10px;flex-wrap:wrap;}
.level-badge{font-family:'Orbitron';background:var(--neon-magenta);color:white;
  padding:5px 15px;border-radius:30px;font-size:0.9rem;}
.case-badge{font-family:'Orbitron';background:#1f2937;color:var(--neon-yellow);
  padding:5px 15px;border-radius:30px;font-size:0.9rem;border:1px solid var(--neon-yellow);}
.progress-segments{display:flex;gap:6px;margin-bottom:20px;}
.progress-segment{flex:1;height:10px;background:#111827;border-radius:5px;
  border:1px solid #374151;cursor:pointer;}
.progress-segment.completed{background:var(--neon-green);border-color:var(--neon-green);}
.progress-segment.current{background:var(--neon-cyan);border-color:var(--neon-cyan);}
.interface-box{background:rgba(31,41,55,0.4);border:1px solid #374151;border-radius:16px;
  padding:20px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between;}
h2{font-family:'Orbitron';font-size:1.2rem;color:var(--neon-yellow);margin-bottom:10px;}
p.instruction{font-size:1.1rem;color:var(--slate-300);line-height:1.4;margin-bottom:15px;}
.interactive-canvas-container{background:#090d16;border-radius:12px;border:1px solid #4b5563;
  overflow:hidden;display:flex;justify-content:center;align-items:center;}
canvas{display:block;background:#05070c;max-width:100%;height:auto;}
.btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;border:none;
  padding:12px 24px;font-family:'Orbitron';font-size:1rem;font-weight:bold;
  border-radius:8px;cursor:pointer;text-transform:uppercase;}
.btn:hover{transform:translateY(-2px);}
.btn-action{width:100%;margin-top:15px;font-size:1.1rem;padding:14px;}
.btn-back{background:linear-gradient(135deg,#475569,#334155);padding:8px 18px;
  font-size:0.85rem;margin-top:10px;}
.input-box-central{display:flex;gap:15px;justify-content:center;align-items:center;margin-top:15px;flex-wrap:wrap;}
input[type="number"]{background:#090d16;border:2px solid #4b5563;color:white;
  font-family:'Orbitron';font-size:1.5rem;width:110px;text-align:center;padding:8px;border-radius:8px;}
input[type="number"]:focus{outline:none;border-color:var(--neon-cyan);}
.feedback-area{min-height:60px;margin-top:15px;display:flex;align-items:center;
  justify-content:center;font-size:1.1rem;font-weight:bold;text-align:center;line-height:1.4;padding:0 10px;}
.success{color:var(--neon-green);}
.error{color:var(--neon-magenta);}
.quiz-question{font-size:1.2rem;color:white;margin:15px 0;text-align:center;font-weight:bold;line-height:1.4;}
.quiz-options{display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto;}
.quiz-option{background:#1f2937;border:2px solid #4b5563;color:white;padding:14px 18px;
  border-radius:10px;font-family:'Rajdhani';font-size:1.05rem;cursor:pointer;text-align:left;font-weight:600;}
.quiz-option:hover:not(:disabled){background:#374151;border-color:var(--neon-cyan);}
.quiz-option.correct{background:rgba(57,255,20,0.2);border-color:var(--neon-green);color:var(--neon-green);}
.quiz-option.incorrect{background:rgba(255,0,119,0.2);border-color:var(--neon-magenta);color:var(--neon-magenta);}
.quiz-explanation{background:rgba(0,242,255,0.1);border-left:4px solid var(--neon-cyan);
  padding:12px 15px;margin-top:15px;border-radius:6px;font-size:1rem;line-height:1.4;}
</style>
</head>
<body>
<div class="game-viewport">
  <header>
    <h1>🛰️ SINCRO-MCM CÓSMICO</h1>
    <div class="level-info">
      <div id="level-badge" class="level-badge">NIVEL 1</div>
      <div id="case-badge" class="case-badge">CASO 1/3</div>
    </div>
  </header>
  <div id="progress-segments" class="progress-segments"></div>
  <div class="interface-box">
    <div>
      <h2 id="stage-title">Cargando...</h2>
      <p id="stage-desc" class="instruction"></p>
    </div>
    <div id="interaction-sandbox"></div>
    <div id="feedback" class="feedback-area"></div>
  </div>
</div>
<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(p){
  if(!audioCtx) return;
  try{
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(p==='hit'){o.frequency.setValueAtTime(440,audioCtx.currentTime);
      g.gain.setValueAtTime(0.1,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.08);}
    else if(p==='success'){o.frequency.setValueAtTime(300,audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+0.3);
      g.gain.setValueAtTime(0.15,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.3);}
    else if(p==='error'){o.type='sawtooth';o.frequency.setValueAtTime(140,audioCtx.currentTime);
      o.frequency.linearRampToValueAtTime(60,audioCtx.currentTime+0.3);
      g.gain.setValueAtTime(0.2,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.3);}
  }catch(e){}
}

  const levels = [
  {num:1, nivel:1, caso:1, totalCasos:5, title:"Detector de Múltiplos",
   desc:"<b>Nivel 1 — Comprensión:</b> Haz clic ÚNICAMENTE en los asteroides que sean múltiplos del número indicado. ¡Atrapa 6 correctos!",
   type:"multiplos-detector"},
  {num:2, nivel:1, caso:2, totalCasos:5, title:"El Encuentro de los Múltiplos",
   desc:"<b>Nivel 1 — Comprensión:</b> Observa los primeros múltiplos de 4 y de 6. Selecciona el <b>MENOR múltiplo que aparece en AMBAS listas</b>. Ese número es el MCM.",
   type:"encuentro-multiplos", a:4, b:6,
   listaA:[4,8,12,16,20], listaB:[6,12,18,24,30], correcto:12},
  {num:3, nivel:1, caso:3, totalCasos:5, title:"Cazador de Comunes",
   desc:"<b>Nivel 1 — Comprensión:</b> Dos ríos de números caen desde arriba. Atrapa SOLO los números que sean múltiplos de AMBOS valores indicados. ¡Atrapa 5 correctos antes de que caigan!",
   type:"cazador-comunes", a:3, b:4},
  {num:4, nivel:1, caso:4, totalCasos:5, title:"Torre del MCM",
   desc:"<b>Nivel 1 — Comprensión:</b> Los números 8 y 12 suben una torre dividiéndose por números primos. En cada piso elige el divisor primo correcto. Si un número no es divisible, se queda igual (eso también cuenta). Al final, multiplica todos los divisores usados para obtener el MCM.",
   type:"torre-mcm", numA:8, numB:12},
  {num:5, nivel:1, caso:5, totalCasos:5, title:"Constructor de MCM en Vivo",
   desc:"<b>Nivel 1 — Comprensión:</b> Tienes las piezas de los factores de 8 y 12. Pulsa las piezas que necesites para construir el MCM. El reactor te muestra el producto en vivo. Recuerda: debes tomar el MAYOR exponente de cada primo. ¡Construye 24!",
   type:"constructor-mcm",
   numA:8, numB:12,
   piezasA:[2,2,2], piezasB:[2,2,3],
   objetivo:24,
   maxPorPrimo:{2:3, 3:1}},
  {num:6, nivel:2, caso:1, totalCasos:5, title:"El MCM en la Vida Real",
   desc:"<b>Nivel 2 — Aplicación:</b> Antes de resolver problemas con el MCM, descubre cómo funciona en situaciones reales: dos cápsulas espaciales salen juntas del mismo punto y necesitamos saber cuándo vuelven a encontrarse. Observa la animación y responde.",
   type:"intro-capsulas", a:6, b:8, correctAnswer:24},
  {num:7, nivel:2, caso:2, totalCasos:5, title:"Fábrica de Fracciones",
   desc:"<b>Nivel 2 — Aplicación:</b> Para sumar fracciones necesitamos el mismo denominador. El más eficiente es el m.c.m. Arrastra el denominador común correcto para igualar 1/4 y 1/6 y observa la vista previa visual.",
   type:"fracciones-mcm-v2", denomA:4, denomB:6, items:["12","24","10","16"], correctAnswer:"12"},
  {num:8, nivel:2, caso:3, totalCasos:5, title:"Organizador de Eventos Sincronizados",
   desc:"<b>Nivel 2 — Aplicación:</b> En la estación espacial hay 3 sistemas que se activan periódicamente: Luces cada 6s, Alarmas cada 8s, Escudos cada 12s. Observa la tabla de tiempo y calcula: ¿cada cuántos segundos coinciden los TRES a la vez?",
   type:"eventos-tabla", tiempos:[6,8,12], correctAnswer:24},
  {num:9, nivel:2, caso:4, totalCasos:5, title:"Sincronizador de Engranajes",
   desc:"<b>Nivel 2 — Aplicación:</b> Tres engranajes del hiperreactor giran a velocidades distintas: uno completa una vuelta cada 4 segundos, otro cada 6 segundos y otro cada 8 segundos. Observa la animación. ¿Después de cuántos segundos vuelven los tres a estar perfectamente alineados?",
   type:"engranajes-dinamico", numeros:[4,6,8], correctAnswer:24},
  {num:10, nivel:2, caso:5, totalCasos:5, title:"Hiper-Conector: Red Estelar Maestra",
   desc:"<b>Nivel 2 — Aplicación:</b> Tres antenas emiten pulsos para comunicar la galaxia: la antena A cada 12 segundos, la B cada 15 y la C cada 20. Observa la animación y calcula: ¿después de cuántos segundos las tres antenas emiten un pulso AL MISMO TIEMPO por primera vez?",
   type:"hiperconector-dinamico", numeros:[12,15,20], correctAnswer:60},
  {num:11, nivel:3, caso:1, totalCasos:5, title:"Validación: ¿Qué es el MCM?",
   desc:"<b>Nivel 3 — Validación:</b> Selecciona la opción correcta.",
   type:"quiz",
   question:"¿Qué es el Mínimo Común Múltiplo de dos números?",
   options:["El número más grande que los divide.",
            "El múltiplo más pequeño que comparten ambos.",
            "El producto de ambos siempre.",
            "La suma de ambos."],
   correct:1,
   explanation:"El MCM es el múltiplo más pequeño (distinto de cero) que comparten dos o más números."},
  {num:12, nivel:3, caso:2, totalCasos:5, title:"Validación: ¿Por qué es mínimo?",
   desc:"<b>Nivel 3 — Validación:</b> Los comunes de 4 y 6 son 12, 24, 36... ¿Por qué elegimos 12?",
   type:"quiz",
   question:"¿Por qué se elige el 12 como MCM de 4 y 6?",
   options:["Porque 12 es más grande.",
            "Porque 12 es el PRIMERO en aparecer en ambas listas.",
            "Porque 12 se obtiene sumando.",
            "Porque 24 no es múltiplo de 4."],
   correct:1,
   explanation:"El 12 es el MENOR múltiplo que comparten ambos."},
  {num:13, nivel:3, caso:3, totalCasos:5, title:"Validación: Relación de Euler",
   desc:"<b>Nivel 3 — Validación:</b> Si mcm(15,20)=60 y mcd(15,20)=5, ¿qué dice la relación de Euler?",
   type:"quiz",
   question:"¿Cuál es la relación de Euler?",
   options:["mcm+mcd=a+b.",
            "mcm×mcd=a×b.",
            "mcm÷mcd=a.",
            "mcm−mcd=b."],
   correct:1,
   explanation:"Euler demostró que mcm(a,b)×mcd(a,b)=a×b. En este caso: 60×5=300=15×20."},
  {num:14, nivel:3, caso:4, totalCasos:5, title:"Validación: Fracciones",
   desc:"<b>Nivel 3 — Validación:</b> Para sumar 1/6 + 1/9, ¿cuál es el denominador correcto?",
   type:"quiz",
   question:"¿Cuál es el denominador común óptimo para 1/6 y 1/9?",
   options:["15 porque 6+9=15.",
            "54 porque 6×9=54.",
            "18 porque es el m.c.m.(6,9).",
            "3 porque es el m.c.d."],
   correct:2,
   explanation:"m.c.m.(6,9)=18. Es el MENOR denominador común posible."},
  {num:15, nivel:3, caso:5, totalCasos:5, title:"Validación: Caso Integrador",
   desc:"<b>Nivel 3 — Validación:</b> Tres drones pasan cada 10s, 15s y 25s. ¿Cada cuánto coinciden los tres?",
   type:"quiz",
   question:"¿Cada cuánto coinciden los tres drones?",
   options:["150 segundos, m.c.m.(10,15,25).",
            "50 segundos, m.c.m.(10,25).",
            "5 segundos, m.c.d.(10,15,25).",
            "75 segundos, 15×5."],
   correct:0,
   explanation:"10=2·5, 15=3·5, 25=5². m.c.m.=2·3·5²=150."}
];

let currentLevelIdx = 0;
let animationId = null;
let canvas, ctx;
let state = {};
let completedCases = new Set();

function renderProgressSegments(){
  const cont = document.getElementById('progress-segments');
  cont.innerHTML = '';
  levels.forEach((lvl, idx) => {
    const seg = document.createElement('div');
    seg.className = 'progress-segment';
    if(completedCases.has(idx)) seg.classList.add('completed');
    else if(idx === currentLevelIdx) seg.classList.add('current');
    seg.title = 'Nivel '+lvl.nivel+' Caso '+lvl.caso;
    if(completedCases.has(idx) || idx <= currentLevelIdx){
      seg.onclick = function(){ jumpToCase(idx); };
      seg.style.cursor = 'pointer';
    } else {
      seg.style.cursor = 'not-allowed';
      seg.style.opacity = '0.4';
    }
    cont.appendChild(seg);
  });
}

function jumpToCase(idx){
  if(!completedCases.has(idx) && idx > currentLevelIdx) return;
  if(animationId) cancelAnimationFrame(animationId);
  currentLevelIdx = idx;
  initLevel();
}

function goBack(){
  let candidates = Array.from(completedCases).filter(i => i !== currentLevelIdx).sort((a,b)=>b-a);
  if(candidates.length > 0) jumpToCase(candidates[0]);
}

function markCompleted(){ completedCases.add(currentLevelIdx); }

function initLevel(){
  if(animationId) cancelAnimationFrame(animationId);
  const lvl = levels[currentLevelIdx];
  document.getElementById('level-badge').innerText = 'NIVEL ' + lvl.nivel;
  document.getElementById('case-badge').innerText = 'CASO ' + lvl.caso + '/' + lvl.totalCasos;
  document.getElementById('stage-title').innerText = lvl.title;
  document.getElementById('stage-desc').innerHTML = lvl.desc;
  document.getElementById('feedback').innerHTML = '';
  renderProgressSegments();
  const container = document.getElementById('interaction-sandbox');
  container.innerHTML = '';
  let backBtnHtml = completedCases.size > 0 ? '<button class="btn btn-back" onclick="goBack()">◀ Volver al último caso completado</button>' : '';

  if(lvl.type === "multiplos-detector"){
    container.innerHTML = '<div class="interactive-canvas-container"><canvas id="gameCanvas" width="850" height="320"></canvas></div>' + backBtnHtml;
    setupMultiplosDetector(lvl);
  } else if(lvl.type === "input-calc"){
    container.innerHTML = '<div class="input-box-central"><input type="number" id="calc-input" placeholder="?"><button class="btn" onclick="evaluateInputCalc()">Verificar</button></div>' + backBtnHtml;
  } else if(lvl.type === "encuentro-multiplos"){
    setupEncuentroMultiplos(lvl);
  } else if(lvl.type === "cazador-comunes"){
    container.innerHTML = '<div class="interactive-canvas-container"><canvas id="gameCanvas" width="850" height="380"></canvas></div>' + backBtnHtml;
    setupCazadorComunes(lvl);
  } else if(lvl.type === "torre-mcm"){
    setupTorreMcm(lvl);
  } else if(lvl.type === "constructor-mcm"){
    setupConstructorMcm(lvl);
  } else if(lvl.type === "intro-capsulas"){
    setupIntroCapsulas(lvl);
  } else if(lvl.type === "fracciones-mcm-v2"){
    setupFraccionesV2(lvl);
  } else if(lvl.type === "eventos-tabla"){
    setupEventosTabla(lvl);
  } else if(lvl.type === "engranajes-dinamico"){
    setupEngranajesDinamico(lvl);
  } else if(lvl.type === "hiperconector-dinamico"){
    setupHiperConectorDinamico(lvl);
  } else if(lvl.type === "quiz"){
    let optionsHtml = lvl.options.map((op,i)=>'<button class="quiz-option" id="qopt-'+i+'" onclick="answerQuiz('+i+')">'+String.fromCharCode(65+i)+'. '+op+'</button>').join('');
    container.innerHTML = '<div class="quiz-question">'+lvl.question+'</div><div class="quiz-options">'+optionsHtml+'</div><div id="quiz-explanation"></div>' + backBtnHtml;
  }
  
}

function setupMultiplosDetector(lvl){
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  state.score = 0;
  state.baseFijo = Math.floor(Math.random()*4)+2;
  state.asteroides = [];
  state.spawnTimer = 0;

  canvas.onclick = function(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    for(let i=state.asteroides.length-1; i>=0; i--){
      let a = state.asteroides[i];
      if(Math.hypot(a.x-mx, a.y-my) <= a.r){
        if(a.valor % state.baseFijo === 0){
          state.score++;
          playSound('hit');
          state.asteroides.splice(i,1);
          if(state.score >= 6){
            cancelAnimationFrame(animationId);
            canvas.onclick = null;
            markCompleted();
            showFeedback(true, '¡Excelente! Reconociste 6 múltiplos de ' + state.baseFijo + '.');
            setTimeout(function(){
              currentLevelIdx++;
              if(currentLevelIdx < levels.length) initLevel();
              else showVictory();
            }, 2500);
          }
        } else {
          playSound('error');
          showFeedback(false, 'Ese número NO es múltiplo de ' + state.baseFijo + '.');
        }
        break;
      }
    }
  };

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(0,242,255,0.1)';
    ctx.fillRect(0,0,canvas.width,60);
    ctx.fillStyle = '#00f2ff';
    ctx.font = 'bold 22px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('MÚLTIPLOS DE ' + state.baseFijo, canvas.width/2, 30);
    ctx.fillStyle = '#39ff14';
    ctx.font = 'bold 16px Orbitron';
    ctx.textAlign = 'left';
    ctx.fillText('ATRAPADOS: ' + state.score + '/6', 20, 30);

    state.spawnTimer++;
    if(state.spawnTimer > 45 && state.asteroides.length < 7){
      state.spawnTimer = 0;
      let esM = Math.random() < 0.5;
      let valor;
      if(esM) valor = state.baseFijo * (Math.floor(Math.random()*6)+1);
      else {
        valor = Math.floor(Math.random()*25)+2;
        while(valor % state.baseFijo === 0) valor = Math.floor(Math.random()*25)+2;
      }
      state.asteroides.push({
        x: Math.random()*(canvas.width-100)+50,
        y: -30, r: 26, valor: valor,
        vel: Math.random()*1.2+0.8
      });
    }

    state.asteroides.forEach(function(a){
      a.y += a.vel;
      let g = ctx.createRadialGradient(a.x-6,a.y-6,3,a.x,a.y,a.r);
      g.addColorStop(0,'#334155'); g.addColorStop(1,'#0f172a');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px Orbitron';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.valor, a.x, a.y);
    });
    state.asteroides = state.asteroides.filter(function(a){ return a.y < canvas.height+40; });
    animationId = requestAnimationFrame(render);
  }
  render();
}

function evaluateInputCalc(){
  const lvl = levels[currentLevelIdx];
  const v = parseInt(document.getElementById('calc-input').value);
  if(v === lvl.correctAnswer){
    markCompleted();
    playSound('success');
    showFeedback(true, '¡Correcto! m.c.m.(6,8) = 24.');
    setTimeout(function(){
      currentLevelIdx++;
      if(currentLevelIdx < levels.length) initLevel();
      else showVictory();
    }, 2500);
  } else {
    playSound('error');
    showFeedback(false, 'Intenta de nuevo. ' + (lvl.hint || ''));
  }
}

function answerQuiz(idx){
  const lvl = levels[currentLevelIdx];
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach(function(b){ b.disabled = true; });
  const expl = document.getElementById('quiz-explanation');
  if(idx === lvl.correct){
    opts[idx].classList.add('correct');
    playSound('success');
    expl.innerHTML = '<div class="quiz-explanation"><b style="color:#39ff14;">✔ ¡Correcto!</b><br>' + lvl.explanation + '</div>';
    markCompleted();
    setTimeout(function(){
      currentLevelIdx++;
      if(currentLevelIdx < levels.length) initLevel();
      else showVictory();
    }, 3500);
  } else {
    opts[idx].classList.add('incorrect');
    opts[lvl.correct].classList.add('correct');
    playSound('error');
    expl.innerHTML = '<div class="quiz-explanation"><b style="color:#ff0077;">✖ Incorrecto.</b><br>' + lvl.explanation + '</div>';
    setTimeout(function(){ initLevel(); }, 5000);
  }
}

function showFeedback(ok, text){
  const fb = document.getElementById('feedback');
  if(ok){ playSound('success'); fb.innerHTML = '<span class="success">✔ ' + text + '</span>'; }
  else { fb.innerHTML = '<span class="error">✖ ' + text + '</span>'; }
}

function showVictory(){
  document.getElementById('progress-segments').innerHTML = '';
  document.getElementById('level-badge').innerText = 'MÁSTER';
  document.getElementById('case-badge').innerText = '3/3';

function setupCazadorComunes(lvl){
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  state.score = 0;
  state.particles = [];
  state.spawnTimer = 0;
  state.errores = 0;

  canvas.onclick = function(e){
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * sx;
    const my = (e.clientY - rect.top) * sy;
    for(let i=state.particles.length-1; i>=0; i--){
      let p = state.particles[i];
      if(Math.hypot(p.x-mx, p.y-my) <= p.r){
        const esComun = (p.valor % lvl.a === 0 && p.valor % lvl.b === 0);
        if(esComun){
          state.score++;
          playSound('hit');
          state.particles.splice(i,1);
          showFeedback(true, '¡Correcto! ' + p.valor + ' es múltiplo de ' + lvl.a + ' y de ' + lvl.b + '. Llevas ' + state.score + '/5.');
          if(state.score >= 5){
            cancelAnimationFrame(animationId);
            canvas.onclick = null;
            markCompleted();
            showFeedback(true, '¡Cazaste los 5 comunes de ' + lvl.a + ' y ' + lvl.b + '! El primero de ellos es el MCM.');
            setTimeout(function(){
              currentLevelIdx++;
              if(currentLevelIdx < levels.length) initLevel();
              else showVictory();
            }, 2800);
          }
        } else {
          playSound('error');
          state.errores++;
          showFeedback(false, 'Ese ' + p.valor + ' NO es múltiplo común. Solo atrapa los que sean múltiplos de ' + lvl.a + ' Y de ' + lvl.b + '.');
          if(state.errores >= 3){
            showFeedback(false, 'Cometiste 3 errores. Reiniciando el caso...');
            cancelAnimationFrame(animationId);
            canvas.onclick = null;
            setTimeout(function(){ initLevel(); }, 2000);
          }
        }
        return;
      }
    }
  };

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(0,242,255,0.1)';
    ctx.fillRect(0,0,canvas.width,50);
    ctx.fillStyle = '#00f2ff';
    ctx.font = 'bold 18px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Atrapa múltiplos de ' + lvl.a + ' Y de ' + lvl.b + ' a la vez', canvas.width/2, 25);
    ctx.fillStyle = '#39ff14';
    ctx.font = 'bold 15px Orbitron';
    ctx.textAlign = 'left';
    ctx.fillText('✓ ' + state.score + '/5', 15, 25);
    ctx.fillStyle = '#ff0077';
    ctx.textAlign = 'right';
    ctx.fillText('✗ ' + state.errores + '/3', canvas.width-15, 25);

    state.spawnTimer++;
    if(state.spawnTimer > 35 && state.particles.length < 8){
      state.spawnTimer = 0;
      const esComun = Math.random() < 0.4;
      let valor;
      if(esComun){
        // Múltiplos del m.c.m.(a,b)
        const mcm = (lvl.a * lvl.b) / gcd(lvl.a, lvl.b);
        valor = mcm * (Math.floor(Math.random()*3)+1);
      } else {
        // No comunes
        valor = Math.floor(Math.random()*30)+2;
        while(valor % lvl.a === 0 && valor % lvl.b === 0) valor = Math.floor(Math.random()*30)+2;
      }
      state.particles.push({
        x: Math.random()*(canvas.width-100)+50,
        y: 50,
        r: 26,
        valor: valor,
        vel: Math.random()*1.2+1.0
      });
    }

    state.particles.forEach(function(p){
      p.y += p.vel;
      let g = ctx.createRadialGradient(p.x-6,p.y-6,3,p.x,p.y,p.r);
      g.addColorStop(0,'#1e293b'); g.addColorStop(1,'#0f172a');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px Orbitron';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.valor, p.x, p.y);
    });
    state.particles = state.particles.filter(function(p){ return p.y < canvas.height+40; });
    animationId = requestAnimationFrame(render);
  }
  render();
}

function gcd(a,b){ return b===0 ? a : gcd(b, a % b); }

function setupTorreMcm(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  sandbox.innerHTML = 
    '<div class="interactive-canvas-container"><canvas id="gameCanvas" width="850" height="400"></canvas></div>' +
    '<div id="torre-opciones" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:15px;"></div>' +
    '<div id="torre-info" style="text-align:center;margin-top:10px;color:#fde047;font-family:Orbitron;font-size:0.95rem;line-height:1.4;"></div>';

  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');

  state.torreA = lvl.numA;
  state.torreB = lvl.numB;
  state.divisoresUsados = [];
  state.pisoActual = 0;
  state.errores = 0;
  state.juegoTerminado = false;
  state.animandoDivision = false;

  const totalPisos = 8;
  const opcionesPosibles = [2, 3, 5, 7];

  function renderTorre(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Encabezado
    ctx.fillStyle = 'rgba(0,242,255,0.08)';
    ctx.fillRect(0,0,canvas.width,55);
    ctx.fillStyle = '#00f2ff';
    ctx.font = 'bold 15px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Divisores usados: ' + (state.divisoresUsados.length ? state.divisoresUsados.join(' × ') : '—'), canvas.width/2, 18);
    ctx.fillStyle = '#39ff14';
    ctx.font = 'bold 13px Orbitron';
    ctx.fillText('Producto parcial = ' + (state.divisoresUsados.length ? state.divisoresUsados.reduce((a,b)=>a*b,1) : 1), canvas.width/2, 40);

    // Torre
    const pisoAlto = 42;
    const anchoTorre = 240;
    const xTorre = (canvas.width - anchoTorre) / 2;
    const yBase = canvas.height - 60;

    for(let i=0; i<totalPisos; i++){
      const y = yBase - (i+1) * pisoAlto;
      ctx.strokeStyle = i < state.pisoActual ? '#39ff14' : '#4b5563';
      ctx.lineWidth = i < state.pisoActual ? 3 : 2;
      ctx.strokeRect(xTorre, y, anchoTorre, pisoAlto);

      if(state.divisoresUsados[i]){
        ctx.fillStyle = '#39ff14';
        ctx.font = 'bold 18px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('÷ ' + state.divisoresUsados[i], canvas.width/2, y + pisoAlto/2);
      }
    }

    // Números actuales a los lados de la base
    ctx.fillStyle = '#00f2ff';
    ctx.font = 'bold 32px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.torreA, xTorre - 55, yBase + 30);
    ctx.font = 'bold 12px Orbitron';
    ctx.fillText('A', xTorre - 55, yBase + 55);

    ctx.fillStyle = '#ff0077';
    ctx.font = 'bold 32px Orbitron';
    ctx.fillText(state.torreB, xTorre + anchoTorre + 55, yBase + 30);
    ctx.font = 'bold 12px Orbitron';
    ctx.fillText('B', xTorre + anchoTorre + 55, yBase + 55);

    // Indicador de piso
    if(!state.juegoTerminado){
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 13px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText('Piso ' + (state.pisoActual + 1), canvas.width/2, yBase - (state.pisoActual+1)*pisoAlto - 8);
    }
  }

  function actualizarOpciones(){
    if(state.juegoTerminado) return;

    // Si ambos ya son 1, terminar (no debería llamarse, pero por seguridad)
    if(state.torreA === 1 && state.torreB === 1){
      finalizarTorre();
      return;
    }

    // Determinar el divisor primo correcto para el SIGUIENTE paso:
    // Es el menor primo que divide a AL MENOS UNO de los dos números.
    let divisorCorrecto = null;
    for(const p of [2,3,5,7]){
      if((state.torreA > 1 && state.torreA % p === 0) || (state.torreB > 1 && state.torreB % p === 0)){
        divisorCorrecto = p;
        break;
      }
    }

    // Si no hay divisor común, dividir cada uno por separado (no debería pasar con estos números)
    if(divisorCorrecto === null){
      // Fallback: dividir el mayor por sí mismo
      divisorCorrecto = Math.max(state.torreA, state.torreB);
    }

    // Opciones: la correcta + 2 distractores
    let opciones = new Set([divisorCorrecto]);
    while(opciones.size < 3){
      const p = opcionesPosibles[Math.floor(Math.random()*opcionesPosibles.length)];
      // Filtrar primos que no dividan ni a A ni a B para evitar confusiones
      if((state.torreA % p !== 0) && (state.torreB % p !== 0) && p !== divisorCorrecto){
        opciones.add(p);
      }
    }

    const cont = document.getElementById('torre-opciones');
    cont.innerHTML = '';
    Array.from(opciones).sort((a,b)=>a-b).forEach(function(op){
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.cssText = 'padding:14px 26px;font-size:1.2rem;background:linear-gradient(135deg,#2563eb,#1d4ed8);min-width:80px;';
      btn.textContent = '÷ ' + op;
      btn.onclick = function(){ probarDivisor(op, divisorCorrecto); };
      cont.appendChild(btn);
    });

    document.getElementById('torre-info').textContent = 
      'A=' + state.torreA + '  ·  B=' + state.torreB + '  →  Elige el primo menor que divida a AL MENOS UNO de los dos.';
  }

  function probarDivisor(elegido, correcto){
    if(state.juegoTerminado) return;

    if(elegido === correcto){
      // Verificar si aplica a A y/o B
      const divideA = (state.torreA % elegido === 0) && state.torreA > 1;
      const divideB = (state.torreB % elegido === 0) && state.torreB > 1;

      if(!divideA && !divideB){
        playSound('error');
        showFeedback(false, '÷' + elegido + ' no divide a ninguno. Revisa los números.');
        return;
      }

      // Dividir los que se puedan
      if(divideA) state.torreA /= elegido;
      if(divideB) state.torreB /= elegido;

      state.divisoresUsados.push(elegido);
      state.pisoActual++;
      playSound('hit');

      let msg = '¡Correcto! ÷' + elegido + ' → ';
      msg += (divideA ? 'A=' + state.torreA : 'A queda en ' + state.torreA);
      msg += ', ';
      msg += (divideB ? 'B=' + state.torreB : 'B queda en ' + state.torreB);
      showFeedback(true, msg);

      renderTorre();

      if(state.torreA === 1 && state.torreB === 1){
        finalizarTorre();
      } else {
        setTimeout(actualizarOpciones, 600);
      }
    } else {
      playSound('error');
      state.errores++;
      let razon = '';
      if(state.torreA % elegido !== 0 && state.torreB % elegido !== 0){
        razon = 'El ÷' + elegido + ' NO divide a ninguno de los dos.';
      } else {
        razon = 'El ÷' + elegido + ' divide, pero NO es el MENOR primo posible. Busca el menor.';
      }
      showFeedback(false, razon);
      if(state.errores >= 3){
        showFeedback(false, 'Cometiste 3 errores. Reiniciando el caso...');
        state.juegoTerminado = true;
        setTimeout(function(){ initLevel(); }, 2000);
      }
    }
  }

  function finalizarTorre(){
    state.juegoTerminado = true;
    markCompleted();
    const mcm = state.divisoresUsados.reduce((a,b)=>a*b,1);
    setTimeout(function(){
      showFeedback(true, '🏗️ ¡TORRE COMPLETADA! MCM(' + lvl.numA + ',' + lvl.numB + ') = ' + state.divisoresUsados.join(' × ') + ' = ' + mcm + '. El MCM es el producto de todos los divisores primos usados.');
    }, 800);
    setTimeout(function(){
      currentLevelIdx++;
      if(currentLevelIdx < levels.length) initLevel();
      else showVictory();
    }, 4800);
  }

  renderTorre();
  actualizarOpciones();
}

function setupLegoFactores(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  
  // Descomponer en factores primos
  function factores(n){
    const f = [];
    let x = n;
    for(let p=2; p<=x; p++){
      while(x % p === 0){ f.push(p); x /= p; }
    }
    return f;
  }
  
  const fA = factores(lvl.numA); // ej: [2,2,2] para 8
  const fB = factores(lvl.numB); // ej: [2,2,3] para 12
  
  // Contar cuántas piezas de cada primo hay en cada uno
  const conteoA = {}, conteoB = {};
  fA.forEach(p => conteoA[p] = (conteoA[p]||0)+1);
  fB.forEach(p => conteoB[p] = (conteoB[p]||0)+1);
  
  // Primos involucrados
  const primos = Array.from(new Set([...fA, ...fB])).sort((a,b)=>a-b);
  
  // Piezas disponibles para arrastrar (todas las de A y B, sin duplicar visualmente)
  // Pero necesitamos exponentes: mostramos piezas individuales
  // Mostraremos cada primo con la cantidad de piezas que tiene el número con MAYOR exponente
  let piezasDisponibles = [];
  primos.forEach(p => {
    const maxExp = Math.max(conteoA[p]||0, conteoB[p]||0);
    for(let i=0; i<maxExp; i++) piezasDisponibles.push(p);
  });
  
  state.reactor = []; // piezas colocadas en el reactor
  state.piezasDisponibles = piezasDisponibles.slice();
  state.primos = primos;
  state.conteoA = conteoA;
  state.conteoB = conteoB;
  state.errores = 0;
  state.juegoTerminado = false;

  function renderTodo(){
    const conteoReactor = {};
    state.reactor.forEach(p => conteoReactor[p] = (conteoReactor[p]||0)+1);
    
    // HTML completo
    let html = '<div style="background:#090d16;border-radius:12px;padding:15px;margin-bottom:10px;">';
    html += '<div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;">';
    
    // Panel A
    html += '<div style="text-align:center;flex:1;min-width:200px;">';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:1rem;margin-bottom:8px;">Número A = ' + lvl.numA + '</div>';
    html += '<div style="font-family:Orbitron;color:#fff;font-size:1.4rem;">= ' + fA.join(' × ') + '</div>';
    html += '</div>';
    
    // Panel B
    html += '<div style="text-align:center;flex:1;min-width:200px;">';
    html += '<div style="font-family:Orbitron;color:#ff0077;font-size:1rem;margin-bottom:8px;">Número B = ' + lvl.numB + '</div>';
    html += '<div style="font-family:Orbitron;color:#fff;font-size:1.4rem;">= ' + fB.join(' × ') + '</div>';
    html += '</div>';
    
    html += '</div></div>';
    
    // Reactor (drop zone)
    html += '<div style="background:rgba(57,255,20,0.08);border:2px solid #39ff14;border-radius:12px;padding:15px;min-height:100px;margin-bottom:10px;">';
    html += '<div style="font-family:Orbitron;color:#39ff14;font-size:1rem;margin-bottom:8px;text-align:center;">⚛️ REACTOR MCM (suelta aquí los factores del mayor exponente)</div>';
    html += '<div id="reactor-zona" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:50px;align-items:center;">';
    
    if(state.reactor.length === 0){
      html += '<span style="color:#64748b;font-style:italic;">Arrastra piezas aquí</span>';
    } else {
      // Agrupar piezas del reactor por primo
      const agrupado = {};
      state.reactor.forEach(p => agrupado[p] = (agrupado[p]||0)+1);
      Object.keys(agrupado).sort((a,b)=>a-b).forEach(p => {
        html += '<div style="background:#39ff14;color:#030712;padding:10px 16px;border-radius:8px;font-family:Orbitron;font-weight:bold;font-size:1.3rem;">' + p + '<sup>' + agrupado[p] + '</sup></div>';
      });
    }
    html += '</div></div>';
    
    // Piezas disponibles
    html += '<div style="background:rgba(0,242,255,0.05);border:1px solid #00f2ff;border-radius:12px;padding:15px;">';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:0.9rem;margin-bottom:8px;text-align:center;">📦 PIEZAS DISPONIBLES (arrastra al reactor)</div>';
    html += '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:50px;align-items:center;">';
    if(state.piezasDisponibles.length === 0){
      html += '<span style="color:#64748b;font-style:italic;">(vacío)</span>';
    } else {
      state.piezasDisponibles.forEach((p, i) => {
        html += '<div class="pieza-arrastrable" draggable="true" data-index="' + i + '" data-primo="' + p + '" style="background:#1f2937;border:2px solid #fde047;color:#fde047;padding:10px 18px;border-radius:8px;font-family:Orbitron;font-weight:bold;font-size:1.3rem;cursor:grab;">' + p + '</div>';
      });
    }
    html += '</div></div>';
    
    // Botones
    html += '<button class="btn btn-action" onclick="verificarLego()">✅ Verificar MCM</button>';
    
    sandbox.innerHTML = html;
    
    // Configurar drag & drop
    document.querySelectorAll('.pieza-arrastrable').forEach(el => {
      el.addEventListener('dragstart', function(e){
        e.dataTransfer.setData('text', this.getAttribute('data-index'));
      });
    });
    
    const zona = document.getElementById('reactor-zona');
    zona.addEventListener('dragover', e => e.preventDefault());
    zona.addEventListener('drop', function(e){
      e.preventDefault();
      const idx = parseInt(e.dataTransfer.getData('text'));
      if(isNaN(idx)) return;
      const primo = state.piezasDisponibles[idx];
      if(primo === undefined) return;
      
      // Mover del pool al reactor
      state.piezasDisponibles.splice(idx, 1);
      state.reactor.push(primo);
      playSound('hit');
      renderTodo();
    });
  }

  window.verificarLego = function(){
    if(state.juegoTerminado) return;
    
    // Contar cuántas piezas de cada primo hay en el reactor
    const conteoReactor = {};
    state.reactor.forEach(p => conteoReactor[p] = (conteoReactor[p]||0)+1);
    
    // Verificar que el reactor tenga exactamente el mayor exponente de cada primo
    let correcto = true;
    let mensaje = '';
    
    for(const p of state.primos){
      const esperado = Math.max(state.conteoA[p]||0, state.conteoB[p]||0);
      const tiene = conteoReactor[p]||0;
      if(tiene !== esperado){
        correcto = false;
        if(tiene < esperado){
          mensaje = 'Falta(n) ' + (esperado - tiene) + ' pieza(s) del primo ' + p + '. Recuerda: debes tomar el MAYOR exponente.';
        } else {
          mensaje = 'Sobran piezas del primo ' + p + '. Debes usar SOLO el mayor exponente, no la suma.';
        }
        break;
      }
    }
    
    // Verificar que no haya primos de más
    if(correcto){
      for(const p in conteoReactor){
        if(!state.primos.includes(parseInt(p))){
          correcto = false;
          mensaje = 'El primo ' + p + ' no aparece en ninguno de los dos números.';
          break;
        }
      }
    }
    
    if(correcto){
      state.juegoTerminado = true;
      markCompleted();
      // Calcular MCM
      let mcm = 1;
      for(const p of state.primos){
        const maxExp = Math.max(state.conteoA[p]||0, state.conteoB[p]||0);
        mcm *= Math.pow(p, maxExp);
      }
      playSound('success');
      showFeedback(true, '¡CORRECTO! El MCM(' + lvl.numA + ',' + lvl.numB + ') = ' + mcm + '. Tomaste el MAYOR exponente de cada primo: ' + state.primos.map(p => {
        const maxExp = Math.max(state.conteoA[p]||0, state.conteoB[p]||0);
        return p + (maxExp>1 ? '^' + maxExp : '');
      }).join(' × ') + '.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4000);
    } else {
      playSound('error');
      state.errores++;
      showFeedback(false, mensaje);
      if(state.errores >= 3){
        showFeedback(false, 'Cometiste 3 errores. Reiniciando el caso...');
        state.juegoTerminado = true;
        setTimeout(function(){ initLevel(); }, 2000);
      }
    }
  };

  renderTodo();
}

// ===== CASO 1.5: DUELO DE FACTORES =====
function setupDueloFactores(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  
  state.factores = lvl.factores.slice(); // [2,2,2,3]
  state.indiceActual = 0;
  state.acumulado = 1;
  state.tiempoRestante = 60; // segundos
  state.juegoTerminado = false;
  state.timer = null;

  function renderDuelo(){
    let html = '';
    
    // Panel de tiempo y progreso
    html += '<div style="display:flex;justify-content:space-between;align-items:center;background:#090d16;border-radius:10px;padding:10px 15px;margin-bottom:10px;">';
    html += '<div style="font-family:Orbitron;color:#fde047;font-size:1.1rem;">⏱️ Tiempo: <span id="timer-display">' + state.tiempoRestante + '</span>s</div>';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:1.1rem;">Paso: ' + state.indiceActual + '/' + state.factores.length + '</div>';
    html += '</div>';
    
    // Factores como piezas
    html += '<div style="background:#090d16;border-radius:12px;padding:15px;margin-bottom:10px;text-align:center;">';
    html += '<div style="font-family:Orbitron;color:#39ff14;font-size:0.95rem;margin-bottom:10px;">Factores primos del MCM:</div>';
    html += '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;">';
    state.factores.forEach((p, i) => {
      const done = i < state.indiceActual;
      const actual = i === state.indiceActual;
      let color = '#4b5563';
      let bg = '#1f2937';
      if(done){ color = '#39ff14'; bg = 'rgba(57,255,20,0.2)'; }
      if(actual){ color = '#fde047'; bg = 'rgba(253,224,71,0.2)'; }
      html += '<div style="background:' + bg + ';border:2px solid ' + color + ';color:' + color + ';padding:10px 18px;border-radius:8px;font-family:Orbitron;font-weight:bold;font-size:1.3rem;">' + p + '</div>';
    });
    html += '</div>';
    html += '</div>';
    
    // Multiplicación actual
    if(state.indiceActual < state.factores.length){
      const factorActual = state.factores[state.indiceActual];
      html += '<div style="background:rgba(0,242,255,0.1);border:2px solid #00f2ff;border-radius:12px;padding:20px;text-align:center;margin-bottom:10px;">';
      html += '<div style="font-family:Orbitron;color:white;font-size:1.3rem;margin-bottom:15px;">';
      html += state.acumulado + ' × ' + factorActual + ' = ?';
      html += '</div>';
      html += '<input type="number" id="input-duelo" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:140px;text-align:center;padding:10px;border-radius:8px;" onkeypress="if(event.key===\'Enter\') verificarPasoDuelo()">';
      html += '</div>';
      html += '<button class="btn btn-action" onclick="verificarPasoDuelo()">Multiplicar</button>';
    } else {
      html += '<div style="background:rgba(57,255,20,0.2);border:2px solid #39ff14;border-radius:12px;padding:20px;text-align:center;margin-bottom:10px;">';
      html += '<div style="font-family:Orbitron;color:#39ff14;font-size:1.5rem;">¡MCM = ' + state.acumulado + '!</div>';
      html += '</div>';
    }
    
    sandbox.innerHTML = html;
    setTimeout(function(){
      const inp = document.getElementById('input-duelo');
      if(inp) inp.focus();
    }, 50);
  }

  window.verificarPasoDuelo = function(){
    if(state.juegoTerminado) return;
    const inp = document.getElementById('input-duelo');
    if(!inp) return;
    const valor = parseInt(inp.value);
    if(isNaN(valor)){ showFeedback(false, 'Escribe un número.'); return; }
    
    const factorActual = state.factores[state.indiceActual];
    const esperado = state.acumulado * factorActual;
    
    if(valor === esperado){
      state.acumulado = esperado;
      state.indiceActual++;
      playSound('hit');
      showFeedback(true, '¡Correcto! ' + (state.indiceActual < state.factores.length ? 'Ahora: ' + state.acumulado + ' × ' + state.factores[state.indiceActual] : '¡Completaste la multiplicación!'));
      renderDuelo();
      
      if(state.indiceActual >= state.factores.length){
        finalizarDuelo();
      }
    } else {
      playSound('error');
      state.tiempoRestante = Math.max(0, state.tiempoRestante - 5);
      showFeedback(false, 'Incorrecto. ' + state.acumulado + ' × ' + factorActual + ' = ' + esperado + '. Pierdes 5 segundos.');
      document.getElementById('timer-display').textContent = state.tiempoRestante;
      if(state.tiempoRestante <= 0){
        finalizarDueloPorTiempo();
      }
    }
  };

  function finalizarDuelo(){
    state.juegoTerminado = true;
    if(state.timer) clearInterval(state.timer);
    markCompleted();
    showFeedback(true, '🏆 ¡DUELO GANADO! MCM = ' + state.acumulado + '. Multiplicaste todos los factores primos correctamente.');
    setTimeout(function(){
      currentLevelIdx++;
      if(currentLevelIdx < levels.length) initLevel();
      else showVictory();
    }, 3500);
  }

  function finalizarDueloPorTiempo(){
    state.juegoTerminado = true;
    if(state.timer) clearInterval(state.timer);
    showFeedback(false, '⏱️ Se acabó el tiempo. El MCM era ' + lvl.correctAnswer + '. Reiniciando...');
    setTimeout(function(){ initLevel(); }, 2500);
  }

  renderDuelo();
  
  // Timer
  state.timer = setInterval(function(){
    if(state.juegoTerminado) return;
    state.tiempoRestante--;
    const disp = document.getElementById('timer-display');
    if(disp) disp.textContent = state.tiempoRestante;
    if(state.tiempoRestante <= 0){
      finalizarDueloPorTiempo();
    }
  }, 1000);
}function setupConstructorMcm(lvl){
  const sandbox = document.getElementById('interaction-sandbox');

  state.reactor = [];
  state.juegoTerminado = false;

  function calcularProducto(piezas){
    return piezas.reduce((a,b)=>a*b, 1);
  }

  function renderConstructor(){
    const productoParcial = calcularProducto(state.reactor);
    const conteoReactor = {};
    state.reactor.forEach(p => conteoReactor[p] = (conteoReactor[p]||0)+1);
    
    let html = '';
    
    // Panel de descomposiciones
    html += '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;">';
    html += '<div style="background:rgba(0,242,255,0.1);border:1px solid #00f2ff;border-radius:10px;padding:12px 18px;">';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:0.9rem;">A = ' + lvl.numA + '</div>';
    html += '<div style="font-family:Orbitron;color:#fff;font-size:1.2rem;">' + lvl.piezasA.join(' × ') + '</div>';
    html += '</div>';
    html += '<div style="background:rgba(255,0,119,0.1);border:1px solid #ff0077;border-radius:10px;padding:12px 18px;">';
    html += '<div style="font-family:Orbitron;color:#ff0077;font-size:0.9rem;">B = ' + lvl.numB + '</div>';
    html += '<div style="font-family:Orbitron;color:#fff;font-size:1.2rem;">' + lvl.piezasB.join(' × ') + '</div>';
    html += '</div>';
    html += '</div>';
    
    // Reactor
    html += '<div style="background:#090d16;border:2px solid ' + (productoParcial === lvl.objetivo ? '#39ff14' : '#a855f7') + ';border-radius:12px;padding:15px;margin-bottom:15px;">';
    html += '<div style="font-family:Orbitron;color:#a855f7;font-size:0.9rem;margin-bottom:8px;text-align:center;">⚛️ REACTOR MCM</div>';
    html += '<div id="reactor-piezas" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px;align-items:center;margin-bottom:10px;">';
    if(state.reactor.length === 0){
      html += '<span style="color:#64748b;font-style:italic;">Pulsa piezas abajo para empezar</span>';
    } else {
      state.reactor.forEach((p, i) => {
        html += '<div onclick="quitarPiezaReactor(' + i + ')" style="background:#a855f7;color:white;padding:10px 18px;border-radius:8px;font-family:Orbitron;font-weight:bold;font-size:1.3rem;cursor:pointer;" title="Clic para quitar">' + p + '</div>';
      });
    }
    html += '</div>';
    html += '<div style="text-align:center;font-family:Orbitron;color:#fde047;font-size:1.1rem;">';
    html += 'Producto parcial: ' + (state.reactor.length ? state.reactor.join(' × ') + ' = ' : '') + productoParcial;
    html += '</div>';
    html += '</div>';
    
    // Piezas disponibles
    html += '<div style="background:rgba(0,242,255,0.05);border:1px solid #00f2ff;border-radius:12px;padding:15px;">';
    html += '<div style="font-family:Orbitron;color:#00f2ff;font-size:0.9rem;margin-bottom:10px;text-align:center;">📦 PIEZAS DISPONIBLES (pulsa para añadir)</div>';
    
    const totales = {};
    lvl.piezasA.concat(lvl.piezasB).forEach(p => totales[p] = (totales[p]||0)+1);
    const disponibles = {};
    Object.keys(totales).forEach(k => {
      const primos = parseInt(k);
      const usado = conteoReactor[primos] || 0;
      disponibles[primos] = totales[primos] - usado;
    });
    
    html += '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">';
    Object.keys(disponibles).sort((a,b)=>a-b).forEach(k => {
      const p = parseInt(k);
      const cant = disponibles[p];
      const maxExp = lvl.maxPorPrimo[p];
      const usado = conteoReactor[p] || 0;
      const bloqueado = usado >= maxExp;
      
      if(cant > 0){
        for(let i=0; i<cant; i++){
          const color = bloqueado ? '#4b5563' : '#1f2937';
          const borderColor = bloqueado ? '#4b5563' : '#fde047';
          const cursor = bloqueado ? 'not-allowed' : 'pointer';
          html += '<div onclick="añadirPiezaConstructor(' + p + ',' + maxExp + ')" style="background:' + color + ';border:2px solid ' + borderColor + ';color:#fde047;padding:10px 18px;border-radius:8px;font-family:Orbitron;font-weight:bold;font-size:1.3rem;cursor:' + cursor + ';">' + p + '</div>';
        }
      }
    });
    html += '</div></div>';
    
    // Objetivo
    html += '<div style="text-align:center;margin-top:12px;font-family:Orbitron;color:#39ff14;font-size:0.95rem;">';
    html += '🎯 OBJETIVO: construir el MCM = ' + lvl.objetivo;
    html += '</div>';
    
    // Botón verificar
    html += '<button class="btn btn-action" onclick="verificarConstructor()" style="margin-top:12px;">Verificar MCM</button>';
    
    sandbox.innerHTML = html;
  }

  window.añadirPiezaConstructor = function(primo, maxExp){
    if(state.juegoTerminado) return;
    const conteo = state.reactor.filter(p => p === primo).length;
    if(conteo >= maxExp){
      playSound('error');
      showFeedback(false, 'Ya tienes el mayor exponente de ' + primo + '. El máximo es ' + maxExp + '.');
      return;
    }
    state.reactor.push(primo);
    playSound('hit');
    
    const producto = calcularProducto(state.reactor);
    if(producto === lvl.objetivo){
      const conteoFinal = {};
      state.reactor.forEach(p => conteoFinal[p] = (conteoFinal[p]||0)+1);
      let completo = true;
      Object.keys(lvl.maxPorPrimo).forEach(p => {
        if((conteoFinal[parseInt(p)]||0) !== lvl.maxPorPrimo[p]) completo = false;
      });
      if(completo){
        finalizarConstructor();
        return;
      }
    }
    renderConstructor();
  };

  window.quitarPiezaReactor = function(idx){
    if(state.juegoTerminado) return;
    state.reactor.splice(idx, 1);
    playSound('hit');
    renderConstructor();
  };

  window.verificarConstructor = function(){
    if(state.juegoTerminado) return;
    const producto = calcularProducto(state.reactor);
    const conteo = {};
    state.reactor.forEach(p => conteo[p] = (conteo[p]||0)+1);
    
    if(producto < lvl.objetivo){
      playSound('error');
      showFeedback(false, 'Aún falta. Llevas ' + producto + ' y el MCM es ' + lvl.objetivo + '. ¿Necesitas más piezas del mayor exponente?');
    } else if(producto > lvl.objetivo){
      playSound('error');
      showFeedback(false, 'Te pasaste. Llevas ' + producto + ' y el MCM es ' + lvl.objetivo + '. Revisa si usaste exponentes de más.');
    } else {
      let expsCorrectos = true;
      Object.keys(lvl.maxPorPrimo).forEach(p => {
        if((conteo[parseInt(p)]||0) !== lvl.maxPorPrimo[p]) expsCorrectos = false;
      });
      if(expsCorrectos){
        finalizarConstructor();
      } else {
        playSound('error');
        showFeedback(false, 'El producto coincide pero los exponentes no son los correctos. Revisa que sea el MAYOR de cada primo.');
      }
    }
  };

  function finalizarConstructor(){
    state.juegoTerminado = true;
    markCompleted();
    playSound('success');
    const exps = {};
    state.reactor.forEach(p => exps[p] = (exps[p]||0)+1);
    let explicacion = Object.keys(exps).sort((a,b)=>a-b).map(p => {
      const exp = exps[p];
      return p + (exp > 1 ? '^' + exp : '');
    }).join(' × ');
    showFeedback(true, '¡MCM CONSTRUIDO! ' + explicacion + ' = ' + lvl.objetivo + '. Tomaste el MAYOR exponente de cada primo.');
    setTimeout(function(){
      currentLevelIdx++;
      if(currentLevelIdx < levels.length) initLevel();
      else showVictory();
    }, 4500);
  }

  renderConstructor();
}function setupEncuentroMultiplos(lvl){

    lvl.listaA.forEach(function(n){

      const esCorrecto = (n === lvl.correcto);

    html += '<div style="display:flex;flex-direction:column;gap:10px;align-items:center;">';
    lvl.listaB.forEach(function(n){
      const seleccionado = state.seleccion && state.seleccion.lista === 'B' && state.seleccion.valor === n;

      const finalizado = state.juegoTerminado;
      
      let bg = '#1f2937';
      let borderColor = '#4b5563';
      let color = 'white';
      
      if(seleccionado){
        if(finalizado && esCorrecto){ bg = 'rgba(57,255,20,0.3)'; borderColor = '#39ff14'; color = '#39ff14'; }
        else if(finalizado && !esCorrecto){ bg = 'rgba(255,0,119,0.3)'; borderColor = '#ff0077'; color = '#ff0077'; }

      } else if(finalizado && esCorrecto){
        bg = 'rgba(57,255,20,0.2)'; borderColor = '#39ff14'; color = '#39ff14';
      }
      
      html += '<button class="num-btn" ' + (finalizado ? 'disabled' : '') + ' onclick="seleccionarEncuentro(\'B\',' + n + ')" style="background:' + bg + ';border:3px solid ' + borderColor + ';color:' + color + ';padding:14px 40px;border-radius:10px;font-family:Orbitron;font-size:1.5rem;font-weight:bold;cursor:' + (finalizado ? 'default' : 'pointer') + ';transition:all 0.2s;min-width:120px;">' + n + '</button>';

      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4000);
    } else {
      // Determinar por qué está mal
      let razon = '';
      if(!esEnListaA && !esEnListaB){
        razon = 'El ' + valor + ' no aparece en ninguna lista.';
      } else if(!esEnListaA){
        razon = 'El ' + valor + ' solo aparece en la lista de múltiplos de ' + lvl.b + ', pero NO en la de ' + lvl.a + '. No es común.';
      } else if(!esEnListaB){
        razon = 'El ' + valor + ' solo aparece en la lista de múltiplos de ' + lvl.a + ', pero NO en la de ' + lvl.b + '. No es común.';
      } else if(valor > lvl.correcto){
        razon = 'El ' + valor + ' SÍ es múltiplo común, pero NO es el MÍNIMO. Busca uno más pequeño que también aparezca en ambas listas.';
      } else {
        razon = 'El ' + valor + ' no es la respuesta correcta.';
      }
      
      playSound('error');
      showFeedback(false, '❌ ' + razon);
      state.seleccion = null;
      renderEncuentro();
    }
  };

  renderEncuentro();

    for(let i=0; i<lvl.denomB; i++){
      const lleno = i < 1;
      html += '<div style="width:20px;height:30px;background:' + (lleno ? '#ff0077' : '#1e293b') + ';border:1px solid #374151;border-radius:2px;"></div>';
    }
    html += '</div></div>';
    
    html += '</div></div>';
    
    // Zona de drop
    html += '<div style="background:rgba(168,85,247,0.1);border:2px dashed #a855f7;border-radius:12px;padding:20px;text-align:center;margin-bottom:15px;">';
    html += '<div style="font-family:Orbitron;color:#a855f7;font-size:0.95rem;margin-bottom:10px;">¿Cuál es el DENOMINADOR COMÚN más pequeño?</div>';
    html += '<div id="zona-drop-frac" style="min-height:60px;display:flex;justify-content:center;align-items:center;font-family:Orbitron;font-size:2rem;color:#fde047;border:2px solid #4b5563;background:#090d16;border-radius:10px;margin-bottom:10px;">' + (state.denominadorElegido || '?') + '</div>';
    html += '</div>';
    
    // Piezas disponibles
    html += '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;">';
    lvl.items.forEach(function(it){
      const selected = (state.denominadorElegido === it);
      const bg = selected ? '#a855f7' : '#1f2937';
      const color = selected ? 'white' : '#fde047';
      html += '<button onclick="elegirDenominador(\'' + it + '\')" style="background:' + bg + ';border:2px solid #fde047;color:' + color + ';padding:12px 24px;border-radius:10px;font-family:Orbitron;font-size:1.3rem;font-weight:bold;cursor:pointer;min-width:70px;">' + it + '</button>';
    });
    html += '</div>';
    
    // Verificación visual si hay denominador
    if(state.denominadorElegido && !state.juegoTerminado){
      const d = parseInt(state.denominadorElegido);
      if(!isNaN(d) && d % lvl.denomA === 0 && d % lvl.denomB === 0){
        const multA = d / lvl.denomA;
        const multB = d / lvl.denomB;
        html += '<div style="background:rgba(57,255,20,0.1);border-left:4px solid #39ff14;padding:10px 15px;border-radius:6px;margin-bottom:10px;font-size:0.95rem;">';
        html += 'Con denominador <b>' + d + '</b>: 1/' + lvl.denomA + ' = ' + multA + '/' + d + ', y 1/' + lvl.denomB + ' = ' + multB + '/' + d + '.';
        html += '</div>';
      }
    }
    
    // Botón verificar
    if(!state.juegoTerminado){
      html += '<button class="btn btn-action" onclick="verificarFraccionesV2()">✅ Verificar Denominador</button>';
    }
    
    sandbox.innerHTML = html;
  }

  window.elegirDenominador = function(d){
    if(state.juegoTerminado) return;
    state.denominadorElegido = d;
    playSound('hit');
    renderFracciones();
  };

  window.verificarFraccionesV2 = function(){
    if(!state.denominadorElegido){
      showFeedback(false, 'Primero elige un denominador.');
      return;
    }
    if(state.denominadorElegido === lvl.correctAnswer){
      state.juegoTerminado = true;
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! El m.c.m. de ' + lvl.denomA + ' y ' + lvl.denomB + ' es ' + lvl.correctAnswer + '. Con denominador 12: 1/4 = 3/12 y 1/6 = 2/12. Suma: 3/12 + 2/12 = 5/12.');
      renderFracciones();
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4500);
    } else {
      const d = parseInt(state.denominadorElegido);
      let razon = '';
      if(d % lvl.denomA !== 0 || d % lvl.denomB !== 0){
        razon = 'El ' + d + ' no es múltiplo de ambos denominadores. Debe ser divisible por ' + lvl.denomA + ' Y por ' + lvl.denomB + '.';
      } else {
        razon = 'El ' + d + ' sí es común, pero NO es el mínimo. Busca uno más pequeño.';
      }
      playSound('error');
      showFeedback(false, razon);
    }
  };

  renderFracciones();
}

// ===== CASO 2.2: CÁPSULAS CON ANIMACIÓN =====
function setupCapsulasAnimado(lvl){
  const sandbox = document.getElementById('interaction-sandbox');
  sandbox.innerHTML = 
    '<div style="background:#090d16;border-radius:12px;padding:20px;margin-bottom:15px;">' +
    '<div style="font-family:Orbitron;color:#00f2ff;font-size:1rem;margin-bottom:15px;text-align:center;">🚀 Simulador de Encuentro Orbital</div>' +
    '<canvas id="circuitoCanvas" width="800" height="220" style="background:#05070c;border-radius:10px;border:1px solid #4b5563;"></canvas>' +
    '<div style="display:flex;justify-content:center;gap:25px;margin-top:12px;font-family:Orbitron;font-size:0.9rem;">' +
    '<span style="color:#00f2ff;">🛸 A = múltiplos de ' + lvl.a + '</span>' +
    '<span style="color:#ff0077;">🚀 B = múltiplos de ' + lvl.b + '</span>' +
    '</div>' +
    '</div>' +
    '<div style="background:rgba(253,224,71,0.1);border-left:4px solid #fde047;padding:12px 15px;border-radius:6px;margin-bottom:15px;">' +
    '<div style="color:#fde047;font-size:1rem;">🎯 <b>Observa con mucha atención.</b> Las cápsulas avanzan saltando por sus múltiplos. ¿En qué segundo ATERRIZAN AMBAS en el MISMO número por primera vez? Anótalo mentalmente o en papel.</div>' +
    '</div>' +
    '<div style="display:flex;justify-content:center;gap:15px;margin-bottom:15px;">' +
    '<button class="btn" onclick="reiniciarCapsulas()" style="background:linear-gradient(135deg,#475569,#334155);">🔄 Reiniciar animación</button>' +
    '</div>' +
    '<div class="input-box-central">' +
    '<input type="number" id="calc-input" placeholder="?" style="background:#090d16;border:2px solid #4b5563;color:white;font-family:Orbitron;font-size:1.6rem;width:130px;text-align:center;padding:10px;border-radius:8px;">' +
    '<button class="btn" onclick="verificarCapsulas()">Verificar</button>' +
    '</div>';

  canvas = document.getElementById('circuitoCanvas');
  ctx = canvas.getContext('2d');

  state.pasoA = 0;
  state.pasoB = 0;
  state.juegoTerminado = false;
  state.frameContador = 0;
  state.framesPorSalto = 45;
  state.maxPasos = 7;
  state.destelloMostrado = false;
  state.momentoCoincidencia = 0;

  window.reiniciarCapsulas = function(){
    state.pasoA = 0;
    state.pasoB = 0;
    state.frameContador = 0;
    state.destelloMostrado = false;
    state.momentoCoincidencia = 0;
    playSound('hit');
  };

  function renderSalto(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const xIni = 60;
    const xFin = canvas.width - 60;
    const ancho = xFin - xIni;
    const yA = 80;
    const yB = 160;

    // Encabezado
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 14px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Posición A: ' + (state.pasoA * lvl.a) + '   ·   Posición B: ' + (state.pasoB * lvl.b), canvas.width/2, 25);

    // Pistas
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(xIni, yA); ctx.lineTo(xFin, yA); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xIni, yB); ctx.lineTo(xFin, yB); ctx.stroke();

    const maxTiempo = 56;
    const escala = ancho / maxTiempo;

    // Marcas de múltiplos de A
    for(let k = 1; k * lvl.a <= maxTiempo; k++){
      const t = k * lvl.a;
      const x = xIni + t * escala;
      const activo = k <= state.pasoA;
      const esComun = (t % lvl.a === 0 && t % lvl.b === 0);
      
      ctx.fillStyle = activo ? (esComun ? '#39ff14' : '#00f2ff') : '#334155';
      ctx.beginPath(); ctx.arc(x, yA, 6, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = activo ? '#fff' : '#64748b';
      ctx.font = '10px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(t, x, yA - 15);
    }

    // Marcas de múltiplos de B
    for(let k = 1; k * lvl.b <= maxTiempo; k++){
      const t = k * lvl.b;
      const x = xIni + t * escala;
      const activo = k <= state.pasoB;
      const esComun = (t % lvl.a === 0 && t % lvl.b === 0);
      
      ctx.fillStyle = activo ? (esComun ? '#39ff14' : '#ff0077') : '#334155';
      ctx.beginPath(); ctx.arc(x, yB, 6, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = activo ? '#fff' : '#64748b';
      ctx.font = '10px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(t, x, yB + 20);
    }

    const posA = state.pasoA > 0 ? xIni + (state.pasoA * lvl.a) * escala : xIni;
    const posB = state.pasoB > 0 ? xIni + (state.pasoB * lvl.b) * escala : xIni;

    // Cápsula A
    ctx.fillStyle = '#00f2ff';
    ctx.beginPath(); ctx.arc(posA, yA, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#030712';
    ctx.font = 'bold 11px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('A', posA, yA);

    // Cápsula B
    ctx.fillStyle = '#ff0077';
    ctx.beginPath(); ctx.arc(posB, yB, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#030712';
    ctx.fillText('B', posB, yB);

    // Detectar coincidencia SIN revelar el número
    const numA = state.pasoA * lvl.a;
    const numB = state.pasoB * lvl.b;
    
    if(numA === numB && numA > 0 && !state.destelloMostrado){
      // Solo destello visual, SIN texto numérico
      state.destelloMostrado = true;
      state.momentoCoincidencia = Date.now();
      playSound('success');
    }

    // Si están coincidiendo, mostrar destello verde por 2 segundos
    if(state.destelloMostrado && Date.now() - state.momentoCoincidencia < 2000){
      const intensidad = Math.abs(Math.sin((Date.now() - state.momentoCoincidencia) / 150));
      ctx.strokeStyle = 'rgba(57,255,20,' + (0.4 + intensidad * 0.6) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(posA, yA, 22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(posB, yB, 22, 0, Math.PI*2); ctx.stroke();
      
      // Línea vertical conectando
      ctx.beginPath();
      ctx.moveTo(posA, yA);
      ctx.lineTo(posB, yB);
      ctx.stroke();
      
      // Solo mensaje genérico, SIN el número
      ctx.fillStyle = '#39ff14';
      ctx.font = 'bold 18px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText('¡COINCIDIERON!', canvas.width/2, canvas.height - 10);
    }

    // Avanzar pasos alternadamente
    if(!state.juegoTerminado && !state.destelloMostrado){
      state.frameContador++;
      if(state.frameContador >= state.framesPorSalto){
        state.frameContador = 0;
        const proxA = state.pasoA * lvl.a;
        const proxB = state.pasoB * lvl.b;
        if(proxA <= proxB && state.pasoA < state.maxPasos){
          state.pasoA++;
        } else if(state.pasoB < state.maxPasos){
          state.pasoB++;
        }
      }
    }

    if(!state.juegoTerminado){
      animationId = requestAnimationFrame(renderSalto);
    }
  }
  renderSalto();

  window.verificarCapsulas = function(){
    const inp = document.getElementById('calc-input');
    const v = parseInt(inp.value);
    if(v === lvl.correctAnswer){
      state.juegoTerminado = true;
      markCompleted();
      playSound('success');
      showFeedback(true, '¡Correcto! Coinciden en el segundo ' + lvl.correctAnswer + '. A dio 4 saltos (6, 12, 18, 24) y B dio 3 saltos (8, 16, 24). El 24 es el menor múltiplo de ambos.');
      setTimeout(function(){
        currentLevelIdx++;
        if(currentLevelIdx < levels.length) initLevel();
        else showVictory();
      }, 4000);
    } else {
      playSound('error');
      showFeedback(false, 'Observa de nuevo. Fíjate en la primera vez que A y B aterrizan en el MISMO número. Puedes reiniciar la animación.');
    }
  };
}
